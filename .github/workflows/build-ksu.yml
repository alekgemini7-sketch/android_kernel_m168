name: Build A03 Core KSU 3.3.0-30

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            libssl-dev \
            libelf-dev \
            libyaml-dev \
            lz4 \
            cpio \
            python3 \
            rsync \
            unzip \
            zip \
            clang \
            llvm \
            lld

      - name: Clone KernelSU v3.3.0-30
        shell: bash
        run: |
          git clone \
            --depth=1 \
            --branch v3.3.0-30 \
            https://github.com/backslashxx/KernelSU.git \
            /tmp/KernelSU

          echo "KernelSU version:"
          git -C /tmp/KernelSU describe --tags --always

      - name: Replace KernelSU source
        shell: bash
        run: |
          rm -rf KernelSU
          cp -a /tmp/KernelSU KernelSU

          echo "KernelSU directory:"
          ls -lah KernelSU

      - name: Setup LLVM
        shell: bash
        run: |
          clang --version
          ld.lld --version
          llvm-ar --version

      - name: Prepare build directory
        shell: bash
        run: |
          rm -rf out
          mkdir -p out

      - name: Configure A03 Core
        shell: bash
        run: |
          make \
            O=out \
            ARCH=arm64 \
            a3core_eur_open_defconfig

      - name: Check KernelSU configuration
        shell: bash
        run: |
          echo "=== KernelSU config ==="
          grep -E \
            'CONFIG_KSU|CONFIG_KPROBES|CONFIG_OVERLAY_FS' \
            out/.config || true

      - name: Build kernel
        shell: bash
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          echo "=== Compiler ==="
          clang --version

          echo "=== Building kernel ==="

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)"

      - name: Verify kernel
        shell: bash
        run: |
          echo "=== Kernel output ==="

          ls -lah out/arch/arm64/boot/

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "Image found!"
            file out/arch/arm64/boot/Image
          else
            echo "ERROR: Image not found"
            exit 1
          fi

      - name: Collect kernel
        shell: bash
        run: |
          mkdir -p artifacts

          cp out/arch/arm64/boot/Image \
            artifacts/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz \
              artifacts/Image.gz
          fi

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb \
              artifacts/Image.gz-dtb
          fi

          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f \
              -name '*.dtb' \
              -exec cp {} artifacts/ \;
          fi

          cp out/.config \
            artifacts/kernel.config

          echo "=== Final artifacts ==="
          ls -lah artifacts

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: A032F-KSU-3.3.0-30
          path: artifacts/
          if-no-files-found: error
