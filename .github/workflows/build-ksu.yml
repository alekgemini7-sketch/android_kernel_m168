name: Build Kernel m168 with KernelSU v3.3.0

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          # Mengunduh compiler Proton Clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Pasang KernelSU v3.3.0
        run: |
          # Hapus versi lama jika ada
          rm -rf drivers/kernelsu
          rm -rf KernelSU
          
          # Download KernelSU ke folder root dengan nama 'KernelSU'
          git clone --depth=1 --branch v3.3.0-30 https://github.com/backslashxx/KernelSU.git KernelSU
          
          # Buat shortcut (symlink) folder kernel-nya ke drivers/kernelsu
          ln -sf ../KernelSU/kernel drivers/kernelsu
          
          # Registrasi ke Makefile dan Kconfig
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"
          
          # Menggunakan defconfig dari log error
          export DEFCONFIG="a3core_eur_open_defconfig"
          
          make O=out ARCH=arm64 $DEFCONFIG
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Hasil Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-m168-KSU-v3.3.0
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
