name: Build Kernel m168 with KernelSU v3.3.0

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Toolchain & Dependencies
        run: |
          sudo apt-get update
          
          # FIX: Menghapus gcc-multilib dan g++-multilib yang menyebabkan bentrok (Conflicts)
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libyaml-dev cpio pkg-config gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
          # Mengunduh compiler Proton Clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          
          # Hapus linker usang bawaan Clang agar tidak bentrok dengan Ubuntu
          rm -f clang/bin/ld

      - name: Pasang KernelSU v3.3.0
        run: |
          rm -rf drivers/kernelsu
          rm -rf KernelSU
          
          git clone --depth=1 --branch v3.3.0-30 https://github.com/backslashxx/KernelSU.git KernelSU
          
          ln -sf ../KernelSU/kernel drivers/kernelsu
          
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"
          export DEFCONFIG="a3core_eur_open_defconfig"
          
          # Hapus aturan -Werror secara menyeluruh agar warning tidak membatalkan kompilasi
          sed -i 's/-Werror//g' Makefile
          sed -i 's/-Werror//g' arch/arm64/Makefile
          export KCFLAGS="-Wno-align-mismatch -Wno-strict-prototypes -Wno-error"
          
          # Perbaiki fungsi lama di driver touchscreen
          sed -i 's/bool get_tp_gesture_stat()/bool get_tp_gesture_stat(void)/g' drivers/input/touchscreen/lct_tp_gesture.c 2>/dev/null || true
          
          # Lumpuhkan assertion generate_fixups di DTC agar tidak crash
          sed -i 's/assert(generate_fixups);//g' scripts/dtc/livetree.c 2>/dev/null || true
          
          # Dummy handler YAML agar DTC tidak error saat linking
          echo '#include "dtc.h"' > scripts/dtc/yamltree.c
          echo 'void dt_to_yaml(FILE *f, struct dt_info *dti) { }' >> scripts/dtc/yamltree.c
          
          # Siapkan konfigurasi kernel
          make O=out ARCH=arm64 $DEFCONFIG HOSTCC=/usr/bin/gcc HOSTCXX=/usr/bin/g++ HOSTLD=/usr/bin/ld
          
          # Kompilasi langsung ke target Image dan Image.gz
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCC=/usr/bin/gcc HOSTCXX=/usr/bin/g++ HOSTLD=/usr/bin/ld Image Image.gz

      - name: Upload Hasil Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-m168-KSU-v3.3.0
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
