name: Build Kernel m168 with KernelSU v3.3.0

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Toolchain & Dependencies
        run: |
          sudo apt-get update
          # Menggunakan libncurses-dev dan menambahkan cpio beserta pkg-config
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libyaml-dev cpio pkg-config
          
          # Mengunduh compiler Proton Clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          
          # FIX: Menghapus linker usang bawaan Clang agar tidak bentrok dengan Ubuntu
          rm -f clang/bin/ld

      - name: Pasang KernelSU v3.3.0
        run: |
          rm -rf drivers/kernelsu
          rm -rf KernelSU
          
          git clone --depth=1 --branch v3.3.0-30 https://github.com/backslashxx/KernelSU.git KernelSU
          
          ln -sf ../KernelSU/kernel drivers/kernelsu
          
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"
          export DEFCONFIG="a3core_eur_open_defconfig"
          
          # FIX: Mengabaikan peringatan alignment (Werror) pada blk-mq.c
          export KCFLAGS="-Wno-align-mismatch"
          
          # FIX: Trik Kuda Troya untuk mematikan kompilasi fitur YAML sepenuhnya
          echo '#include "dtc.h"' > scripts/dtc/yamltree.c
          echo 'void dt_to_yaml(FILE *f, struct dt_info *dti) { }' >> scripts/dtc/yamltree.c
          
          # Buat konfigurasi dengan Host Tools Ubuntu murni
          make O=out ARCH=arm64 $DEFCONFIG HOSTCC=/usr/bin/gcc HOSTCXX=/usr/bin/g++ HOSTLD=/usr/bin/ld
          
          # Kompilasi Inti
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCC=/usr/bin/gcc HOSTCXX=/usr/bin/g++ HOSTLD=/usr/bin/ld

      - name: Upload Hasil Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-m168-KSU-v3.3.0
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
